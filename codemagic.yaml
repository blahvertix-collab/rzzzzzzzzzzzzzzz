workflows:
  ios-workflow:
    name: Rizzsist iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 16.4
    scripts:
      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          brew install xcodegen || true
          xcodegen generate
      - name: Build unsigned
        script: |
          cd $CM_BUILD_DIR
          xcodebuild -project Rizzsist.xcodeproj -scheme Rizzsist -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" -derivedDataPath build/DerivedData build
      - name: Package unsigned IPA
        script: |
          cd $CM_BUILD_DIR
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Rizzsist.app"
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry Rizzsist-unsigned.ipa Payload
    artifacts:
      - build/ipa/*.ipa
